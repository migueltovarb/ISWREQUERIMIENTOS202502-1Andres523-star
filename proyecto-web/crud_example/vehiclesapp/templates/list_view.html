<!DOCTYPE html>
<html>
<head>
    <title>Lista de Vehículos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .actions a {
            margin-right: 10px;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 3px;
        }
        .edit-btn {
            background-color: #28a745;
            color: white;
        }
        .delete-btn {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Vehículos Registrados</h1>
        
        <a href="{% url 'vehicle_create' %}" class="btn">Crear Nuevo Vehículo</a>
        
        <table>
            <thead>
                <tr>
                    <th>Placa</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Color</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for vehicle in vehicles %}
                <tr>
                    <td>{{ vehicle.numero_placa }}</td>
                    <td>{{ vehicle.marca }}</td>
                    <td>{{ vehicle.modelo }}</td>
                    <td>{{ vehicle.color }}</td>
                    <td class="actions">
                        <a href="{% url 'vehicle_update' vehicle.pk %}" class="edit-btn">Editar</a>
                        <a href="{% url 'vehicle_delete' vehicle.pk %}" class="delete-btn">Eliminar</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="5" style="text-align: center;">No hay vehículos registrados</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
