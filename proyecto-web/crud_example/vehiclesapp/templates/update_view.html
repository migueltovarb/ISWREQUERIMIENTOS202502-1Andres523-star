<!DOCTYPE html>
<html>
<head>
    <title>Editar Vehículo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            width: 400px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        button {
            background-color: #28a745;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        
        button:hover {
            background-color: #218838;
        }
        
        .back-link {
            display: block;
            margin-top: 15px;
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Editar Vehículo</h1>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_numero_placa">Número de placa:</label>
                {{ form.numero_placa }}
            </div>
            
            <div class="form-group">
                <label for="id_marca">Marca del vehículo:</label>
                {{ form.marca }}
            </div>
            
            <div class="form-group">
                <label for="id_modelo">Modelo del vehículo:</label>
                {{ form.modelo }}
            </div>
            
            <div class="form-group">
                <label for="id_color">Color del vehículo:</label>
                {{ form.color }}
            </div>
            
            <button type="submit">Actualizar</button>
        </form>
        
        <a href="{% url 'vehicle_list' %}" class="back-link">Volver a la lista</a>
    </div>
</body>
</html>
